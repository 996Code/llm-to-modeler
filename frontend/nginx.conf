# llm-to-modler 前端 nginx
# - 静态资源:vite base=/ai-modeler/,产物直接挂在 /ai-modeler/ 路径下
# - API 反代:/ai-modeler/api → backend:18080(SSE 需关缓冲)
# - 嵌入 SDK:embed-demo.html / embed.js 宿主直引

server {
    listen 80;
    server_name _;

    # 上传体积(知识库文档最大 20MB,留余量)
    client_max_body_size 64m;

    # ── 静态资源 ──
    # /ai-modeler/ 前缀:与 vite base 一致,dist 内容原样映射
    location /ai-modeler/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /ai-modeler/index.html;
    }
    # 根路径跳转到应用(顺手直达)
    location = / {
        return 302 /ai-modeler/;
    }

    # ── API 反代(含 SSE) ──
    location /ai-modeler/api/ {
        proxy_pass http://backend:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Id $http_x_user_id;
        # SSE:关缓冲 + 拉长读超时(长对话/任务流式期间连接保持)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    # 健康检查直通(后端 /api/health 与 /health 都有)
    location /ai-modeler/health {
        proxy_pass http://backend:18080/api/health;
        proxy_set_header Host $host;
    }
}
