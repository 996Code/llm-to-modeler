server {
    listen 80;
    server_name _;

    # ── 统一项目前缀 /ai-modeler（与 designer dev 代理、生产网关反代约定一致）──

    # Frontend SPA（挂在 /ai-modeler/ 下，vite build base 同步）
    location /ai-modeler/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-modeler/index.html;
    }

    # embed.js (standalone SDK file)
    location = /ai-modeler/embed.js {
        root /usr/share/nginx/html;
    }

    # API proxy to backend（剥 /ai-modeler 前缀，后端仍在 /api/*）
    location /ai-modeler/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_buffering off;          # important for SSE
        proxy_cache off;
        proxy_read_timeout 300s;       # LLM can be slow
    }

    # MCP proxy to backend
    location /ai-modeler/mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Health check
    location /ai-modeler/health {
        proxy_pass http://backend:8000/health;
    }
}
