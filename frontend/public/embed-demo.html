<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主系统 - 智能助手（嵌入演示）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      color: #1f2329;
    }

    /* 模拟主系统顶部导航栏 */
    .topbar {
      background: #fff;
      height: 56px;
      border-bottom: 1px solid #e5e6eb;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .topbar-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00b42c, #00d680);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
    }
    .topbar-title { font-size: 16px; font-weight: 600; }
    .topbar-user {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      padding: 4px 12px;
      background: #f7f8fa;
      border-radius: 20px;
      font-size: 13px; color: #4e5969;
    }
    .topbar-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #3370ff;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    /* 主内容区 */
    .main {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* 左侧菜单 */
    .sidebar {
      width: 200px;
      background: #fff;
      border-right: 1px solid #e5e6eb;
      padding: 16px 0;
      flex-shrink: 0;
    }
    .menu-item {
      padding: 10px 24px;
      font-size: 14px;
      color: #4e5969;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.2s;
    }
    .menu-item:hover { background: #f7f8fa; }
    .menu-item.active {
      background: #eaf0ff;
      color: #3370ff;
      font-weight: 500;
      border-right: 3px solid #3370ff;
    }
    .menu-icon { font-size: 16px; }

    /* 右侧工作区 */
    .content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-title { font-size: 20px; font-weight: 600; }
    .page-actions { display: flex; gap: 8px; }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #e5e6eb;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: #3370ff; color: #3370ff; }
    .btn-primary {
      background: #3370ff;
      border-color: #3370ff;
      color: #fff;
    }
    .btn-primary:hover { background: #2860e6; color: #fff; }

    /* 场景卡片 */
    .scene-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e6eb;
      padding: 24px;
      min-height: 400px;
    }
    .scene-empty {
      text-align: center;
      padding: 60px 20px;
      color: #c9cdd4;
    }
    .scene-empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* AI 产出的结果展示 */
    .result-preview { margin-top: 16px; }
    .result-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2329;
      margin-bottom: 4px;
    }
    .result-subtitle {
      font-size: 12px;
      color: #86909c;
      font-family: 'SF Mono', monospace;
      margin-bottom: 16px;
    }

    /* 数据卡(知识图谱检索结果) */
    .data-card {
      border: 1px solid #e5e6eb;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .data-card-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
      font-size: 14px; font-weight: 600;
    }
    .data-card-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .data-stats { display: flex; gap: 32px; }
    .data-stat { display: flex; flex-direction: column; gap: 2px; }
    .data-stat-num { font-size: 22px; font-weight: 700; color: #3370ff; }
    .data-stat-label { font-size: 12px; color: #86909c; }
    .data-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .data-chip {
      padding: 2px 10px;
      background: #f2f3f5;
      border-radius: 12px;
      font-size: 12px;
      color: #4e5969;
    }

    /* 表格(表单配置结果,兼容旧场景) */
    .field-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .field-table th {
      background: #f7f8fa;
      padding: 10px 12px;
      text-align: left;
      font-weight: 500;
      color: #86909c;
      border-bottom: 1px solid #e5e6eb;
    }
    .field-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f1f3;
    }
    .field-type-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    /* JSON 展示 */
    .json-display {
      margin-top: 16px;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #d4d4d4;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 日志面板 */
    .log-panel {
      margin-top: 16px;
      background: #fff;
      border: 1px solid #e5e6eb;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      font-family: 'SF Mono', monospace;
      color: #86909c;
      max-height: 120px;
      overflow-y: auto;
    }
    .log-entry { padding: 2px 0; }
    .log-entry .log-time { color: #c9cdd4; margin-right: 8px; }
    .log-entry .log-type {
      display: inline-block;
      padding: 0 4px;
      border-radius: 3px;
      font-size: 10px;
      margin-right: 6px;
    }
    .log-type-info { background: #eaf0ff; color: #3370ff; }
    .log-type-success { background: #e8ffea; color: #00b42c; }
    .log-type-apply { background: #fff3e8; color: #ff7d00; }
  </style>
</head>
<body>

<!-- ============ 认证检查 ============ -->
<script>
if (!localStorage.getItem('auth_token')) {
  window.location.replace('/ai-modeler/auth.html?page=embed-demo')
}
</script>

<!-- 模拟主系统导航栏 -->
<div class="topbar">
  <div class="topbar-logo">智</div>
  <span class="topbar-title">智能业务平台</span>
  <div class="topbar-user">
    <div class="topbar-avatar">张</div>
    <span>张三 (zhangsan)</span>
  </div>
</div>

<div class="main">
  <!-- 左侧菜单 -->
  <div class="sidebar">
    <div class="menu-item"><span class="menu-icon">🏠</span> 工作台</div>
    <div class="menu-item active"><span class="menu-icon">🤖</span> 智能助手</div>
    <div class="menu-item"><span class="menu-icon">📊</span> 数据报表</div>
    <div class="menu-item"><span class="menu-icon">📁</span> 文档中心</div>
    <div class="menu-item"><span class="menu-icon">⚙️</span> 系统设置</div>
  </div>

  <!-- 主内容区：模拟业务工作区 -->
  <div class="content">
    <div class="page-header">
      <div class="page-title">智能助手工作区</div>
      <div class="page-actions">
        <button class="btn" onclick="clearResult()">清空</button>
      </div>
    </div>

    <div class="scene-card">
      <div id="empty-state" class="scene-empty">
        <div class="scene-empty-icon">🤖</div>
        <p>暂无 AI 产出结果</p>
        <p style="font-size: 13px; margin-top: 4px;">
          点击右下角 <strong>💬</strong> 按钮，通过自然语言与智能助手对话——<br>
          知识库问答、表单生成、业务查询等能力即问即答
        </p>
      </div>

      <!-- AI 产出结果(通用数据卡:KG 检索/表单配置等) -->
      <div id="result-preview" class="result-preview" style="display: none;">
        <div class="result-title" id="result-title">AI 结果</div>
        <div class="result-subtitle" id="result-subtitle"></div>

        <!-- 数据卡(知识图谱检索结果) -->
        <div class="data-card" id="data-card" style="display: none;">
          <div class="data-card-header">
            <div class="data-card-icon">🔍</div>
            <span id="data-card-title">知识图谱检索</span>
          </div>
          <div class="data-stats">
            <div class="data-stat">
              <span class="data-stat-num" id="stat-entities">0</span>
              <span class="data-stat-label">命中实体</span>
            </div>
            <div class="data-stat">
              <span class="data-stat-num" id="stat-relations">0</span>
              <span class="data-stat-label">命中关系</span>
            </div>
            <div class="data-stat">
              <span class="data-stat-num" id="stat-chunks">0</span>
              <span class="data-stat-label">文档片段</span>
            </div>
          </div>
          <div class="data-chips" id="data-chips"></div>
        </div>

        <!-- 表单配置表格(表单场景,兼容旧展示) -->
        <div id="config-preview" style="display: none;">
          <table class="field-table">
            <thead>
              <tr>
                <th width="40">#</th>
                <th>字段名称</th>
                <th>字段标识</th>
                <th>类型</th>
              </tr>
            </thead>
            <tbody id="field-tbody"></tbody>
          </table>
        </div>

        <details style="margin-top: 16px;">
          <summary style="cursor: pointer; font-size: 13px; color: #3370ff;">
            查看完整 JSON
          </summary>
          <div class="json-display" id="json-display"></div>
        </details>
      </div>
    </div>

    <!-- 通信日志 -->
    <div class="log-panel" id="log-panel">
      <div class="log-entry" style="color: #c9cdd4;">
        <span class="log-time">--:--:--</span>
        postMessage 通信日志（iframe ↔ 主系统）
      </div>
    </div>
  </div>
</div>

<!-- ============ 嵌入 SDK ============ -->
<script type="module">
  // ★★★ 修改为你实际部署的地址 ★★★
  // 同源部署（本示例）：用 '/ai-modeler'（vite base 前缀）；
  // 跨域部署改成完整地址，如 'http://192.168.99.22:19090/ai-modeler'
  const MODELER_BASE_URL = '/ai-modeler'
  const USER_ID = 'zhangsan'

  // dev 模式直接引入 embed.ts（Vite 原生支持 TS）
  // production 模式引入构建产物 embed.js
  // 用 location.port 判断：dev server 在 13080。
  // dev 路径必须带 base 前缀（vite base=/ai-modeler/）：裸 /src/embed.ts 会 404
  const isDev = location.port === '13080'
  const embedModule = isDev
    ? await import('/ai-modeler/src/embed.ts')
    : await import(MODELER_BASE_URL + '/embed.js')

  const LLMFormModeler = embedModule.default || window.LLMFormModeler

  log('SDK 加载完成（' + (isDev ? 'dev' : 'prod') + '模式）', 'info')

  // 初始化
  const modeler = new LLMFormModeler({
    baseUrl: MODELER_BASE_URL,
    userId: USER_ID,
    position: 'bottom-right',

    // 嵌入模式认证：宿主把 token 通过 headers 透传给 iframe（模拟真实宿主
    // 调 /api/auth/token 获取后下发的场景；同源 demo 直接复用 localStorage）
    headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('auth_token') || '') },

    // 宿主"工作区"的当前配置（GET_CONTEXT/APPLY 的 artifact 来源）——
    // 与 mind-designer 的 currentVo() 同角色，AI 据此做增量修改的基线
    getArtifact: () => currentConfig,

    // 配置生成成功（每次 LLM 生成后触发）
    onConfigGenerated: (config) => {
      log('收到产出: ' + (config.formName || config.kb?.name || '结果'), 'info')
    },

    // 用户在 iframe 内点"应用"（契约 APPLY：渲染回调 + SDK 自动回执）
    onConfigApply: (config) => {
      log('应用结果到工作区: ' + (config.formName || config.kb?.name || ''), 'apply')
      renderResult(config)
      highlightCard()
    },

    onClose: () => {
      log('聊天窗口已关闭', 'info')
    }
  })
</script>

<!-- ============ 页面交互逻辑 ============ -->
<script>
  let currentConfig = null

  const TYPE_NAMES = {
    0: ['TEXT', '#eaf0ff', '#3370ff'],
    1: ['NUMBER', '#fff7e8', '#ff7d00'],
    2: ['DATE', '#e8ffea', '#00b42c'],
    3: ['FILE', '#f0e8ff', '#722ed1'],
    4: ['SELECT', '#ffe8ea', '#f54a45'],
    5: ['MULTI', '#e8ffff', '#0fc6c2'],
    6: ['DEPT', '#f7f8fa', '#4e5969'],
    7: ['USER', '#eaf0ff', '#3370ff'],
    8: ['AUTO', '#f7f8fa', '#86909c'],
    12: ['SEG', '#fff3e8', '#ff7d00'],
  }

  /** 渲染 AI 产出:按制品类型分流(知识图谱数据卡 / 表单配置表格) */
  function renderResult(artifact) {
    if (!artifact) return
    currentConfig = artifact

    document.getElementById('empty-state').style.display = 'none'
    const preview = document.getElementById('result-preview')
    preview.style.display = 'block'

    // 知识图谱检索结果(kg_search_result):数据卡展示命中统计
    const isKg = artifact.type === 'kg_search_result'
    document.getElementById('data-card').style.display = isKg ? 'block' : 'none'
    document.getElementById('config-preview').style.display = isKg ? 'none' : 'block'

    if (isKg) {
      const kb = artifact.kb || {}
      const sub = artifact.subgraph || {}
      const sources = artifact.sources || {}
      document.getElementById('result-title').textContent = '知识库检索结果'
      document.getElementById('result-subtitle').textContent = 'kb: ' + (kb.name || '')
      document.getElementById('data-card-title').textContent = '「' + (kb.name || '知识库') + '」检索命中'
      document.getElementById('stat-entities').textContent = (sub.nodes || []).length
      document.getElementById('stat-relations').textContent = (sub.edges || []).length
      document.getElementById('stat-chunks').textContent = (sources.chunks || []).length
      // 实体 chips(前 12 个)
      const chips = (sources.entities || []).slice(0, 12)
        .map(e => `<span class="data-chip">${escapeHtml(e)}</span>`).join('')
      document.getElementById('data-chips').innerHTML = chips
    } else {
      // 表单配置:沿用字段表格展示
      document.getElementById('result-title').textContent = artifact.formName || '配置结果'
      document.getElementById('result-subtitle').textContent = 'formCode: ' + (artifact.formCode || '')
      const fields = artifact.formFieldConfigVos || []
      const tbody = document.getElementById('field-tbody')
      tbody.innerHTML = fields.map((f, i) => {
        const [name, bg, color] = TYPE_NAMES[f.formFieldType] || ['?', '#f7f8fa', '#86909c']
        return `<tr>
          <td>${i + 1}</td>
          <td>${escapeHtml(f.fieldTitleText || '')}</td>
          <td style="font-family: monospace; color: #86909c;">${escapeHtml(f.fieldTitleKey || '')}</td>
          <td><span class="field-type-tag" style="background:${bg};color:${color};">${name}</span></td>
        </tr>`
      }).join('')
    }

    document.getElementById('json-display').textContent =
      JSON.stringify(artifact, null, 2)
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  }

  function clearResult() {
    currentConfig = null
    document.getElementById('empty-state').style.display = 'block'
    document.getElementById('result-preview').style.display = 'none'
    log('已清空', 'info')
  }

  function highlightCard() {
    const card = document.querySelector('.scene-card')
    card.style.borderColor = '#3370ff'
    card.style.boxShadow = '0 0 0 3px rgba(51,112,255,0.1)'
    setTimeout(() => {
      card.style.borderColor = '#e5e6eb'
      card.style.boxShadow = 'none'
    }, 1500)
  }

  function log(msg, type = 'info') {
    const now = new Date()
    const time = now.toTimeString().slice(0, 8)
    const panel = document.getElementById('log-panel')
    const entry = document.createElement('div')
    entry.className = 'log-entry'
    entry.innerHTML = `<span class="log-time">${time}</span><span class="log-type log-type-${type}">${type.toUpperCase()}</span>${escapeHtml(msg)}`
    panel.appendChild(entry)
    panel.scrollTop = panel.scrollHeight
  }
</script>

</body>
</html>
