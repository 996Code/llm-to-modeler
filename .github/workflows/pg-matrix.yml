# PG15/PG16 真实进程矩阵(CI 持续证据)
# PG15 → 平台保持 ready，ChatBI 被版本门禁整包隔离并暴露原因。
# PG16 → migration-before-ready 通过，且 ChatBI 完整装配。
# ChatBI 默认是可选 pack；本矩阵验证 pack 版本边界，不把它硬绑为平台必选项。
name: pg-matrix
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/pg-matrix.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/pg-matrix.yml']

jobs:
  pg15-rejected:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: matrix15
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps (no fallback)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: PG15 keeps platform ready and isolates ChatBI
        working-directory: backend
        env:
          DATABASE_URL: postgresql://root:root@localhost:15432/matrix15
          FERNET_KEY: NG6ewZrFKK1Is3v4IGClrakyBGYcjnfKSRfbqzllkwk=
          PACK_STATE_PATH: /tmp/m15.json
          PACKS_ENABLED: chatbi,leave_application
          PACK_DEPENDENCY_PROBE: "0"
          LLM_BASE_URL: http://127.0.0.1:9/v1
          LLM_API_KEY: x
        run: |
          cleanup() { kill ${UVPID:-0} 2>/dev/null || true; }
          trap cleanup EXIT
          python -m uvicorn main:app --port 18071 --app-dir src \
            > /tmp/pg15_boot.log 2>&1 &
          UVPID=$!
          ready=0
          for i in $(seq 1 50); do
            curl -sf http://127.0.0.1:18071/api/health > /tmp/pg15_health.json \
              && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: PG15 下平台未就绪"; cat /tmp/pg15_boot.log; exit 1
          fi
          curl -sf http://127.0.0.1:18071/api/admin/packs > /tmp/pg15_packs.json
          python - <<'PY'
          import json

          with open("/tmp/pg15_packs.json", encoding="utf-8") as source:
              payload = json.load(source)
          packs = {item["name"]: item for item in payload["items"]}
          chatbi = packs["chatbi"]
          fallback = packs["leave_application"]
          assert chatbi["enabled"] is True, chatbi
          assert chatbi["loaded"] is False, chatbi
          assert "PostgreSQL >= 16" in chatbi["runtimeError"], chatbi
          assert fallback["loaded"] is True, fallback
          PY
          kill -0 $UVPID 2>/dev/null || {
            echo "FAIL: PG15 ready 后进程退出"; cat /tmp/pg15_boot.log; exit 1; }
          echo "PASS: PG15 平台正常，ChatBI 被版本门禁隔离"

  pg16-ready:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: matrix16
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps (no fallback)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: PG16 migration-before-ready
        working-directory: backend
        env:
          DATABASE_URL: postgresql://root:root@localhost:15433/matrix16
          FERNET_KEY: NG6ewZrFKK1Is3v4IGClrakyBGYcjnfKSRfbqzllkwk=
          PACK_STATE_PATH: /tmp/m16.json
          PACKS_ENABLED: chatbi,leave_application
          PACK_DEPENDENCY_PROBE: "0"
          LLM_BASE_URL: http://127.0.0.1:9/v1
          LLM_API_KEY: x
        run: |
          cleanup() { kill ${UVPID:-0} 2>/dev/null || true; }
          trap cleanup EXIT
          python -m uvicorn main:app --port 18072 --app-dir src \
            > /tmp/pg16_boot.log 2>&1 &
          UVPID=$!
          ready=0
          for i in $(seq 1 50); do
            curl -sf http://127.0.0.1:18072/api/health > /dev/null 2>&1 \
              && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: PG16 未就绪"; cat /tmp/pg16_boot.log; exit 1
          fi
          # 四十审 P2: ready 后进程必须仍存活(不能 ready 即退)
          sleep 3
          if ! kill -0 $UVPID 2>/dev/null; then
            echo "FAIL: PG16 ready 后进程退出"; cat /tmp/pg16_boot.log; exit 1
          fi
          curl -sf http://127.0.0.1:18072/api/admin/packs > /tmp/pg16_packs.json
          python - <<'PY'
          import json

          with open("/tmp/pg16_packs.json", encoding="utf-8") as source:
              payload = json.load(source)
          packs = {item["name"]: item for item in payload["items"]}
          chatbi = packs["chatbi"]
          assert chatbi["enabled"] is True, chatbi
          assert chatbi["loaded"] is True, chatbi
          assert not chatbi["runtimeError"], chatbi
          assert {"ask_data", "switch_chart"}.issubset(chatbi["tools"]), chatbi
          PY
          echo "PASS: PG16 migration-before-ready 且 ChatBI 完整装配"
