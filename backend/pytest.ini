[pytest]
minversion = 6.0
addopts = -ra --strict-markers --tb=short
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    error
    # FastAPI/Starlette 当前 TestClient 仍引用 anyio 的 deprecated alias。
    # 只过滤精确上游消息；项目自身或其它依赖新增 warning 会直接使测试失败。
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning
