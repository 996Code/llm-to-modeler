# chatbi 插件声明式设置页(设置页 > env > 默认;热生效)
version: 1
groups:
  - key: infra
    title: 基础设施依赖
    fields:
      - key: milvus_uri
        type: string
        label: Milvus 地址
        env: MILVUS_URI
        required: true
        placeholder: http://milvus:19530
        help: 语义层向量检索(两阶段召回);未配置时插件中心显示依赖未配置且不可启用
  - key: security
    title: 凭据加密
    fields:
      - key: fernet_key
        type: secret
        label: Fernet 密钥
        env: FERNET_KEY
        required: true
        placeholder: openssl rand -hex 32 生成
        help: 数据源密码加密存储;更换后已存密码无法解密(需重新录入)
  - key: query
    title: 查询执行
    fields:
      - key: sql_execution_timeout
        type: int
        label: SQL 执行超时(秒)
        default: 30
        min: 5
        max: 300
      - key: sql_max_rows
        type: int
        label: 结果最大行数
        default: 10000
        min: 100
        max: 100000
      - key: db_connect_timeout
        type: int
        label: 数据库连接超时(秒)
        default: 5
        min: 1
        max: 60
      - key: sql_self_heal_rounds
        type: int
        label: SQL 自愈轮数上限
        default: 2
        min: 0
        max: 5
      - key: sql_self_heal_circuit_breaker
        type: int
        label: 自愈熔断阈值(跨查询连续失败)
        default: 3
        min: 1
        max: 20
  - key: retrieve
    title: 检索
    fields:
      - key: retrieve_top_k
        type: int
        label: 向量召回条数
        default: 20
        min: 5
        max: 100
      - key: rag_score_threshold
        type: float
        label: 向量召回分数阈值
        default: 0.35
        min: 0.1
        max: 0.9
      - key: fewshot_top_k
        type: int
        label: Few-shot 示例数
        default: 3
        min: 0
        max: 10
      - key: clarify_table_threshold
        type: int
        label: 触发表选择的表数阈值
        default: 8
        min: 3
        max: 100
  - key: graph
    title: 知识图谱
    fields:
      - key: graph_enabled
        type: bool
        label: 启用图谱表扩展与 JOIN 路径
        default: true
      - key: graph_max_join_path_hops
        type: int
        label: JOIN 路径最大跳数
        default: 4
        min: 1
        max: 8
      - key: graph_expand_depth
        type: int
        label: 表扩展 BFS 深度
        default: 2
        min: 1
        max: 6
      - key: graph_expand_max_total
        type: int
        label: 表扩展总数上限(含社区补全)
        default: 10
        min: 2
        max: 50
      - key: graph_expand_use_community
        type: bool
        label: 表扩展启用社区补全
        default: true
      - key: graph_join_path_in_prompt
        type: bool
        label: 在 SQL prompt 注入 JOIN 路径
        default: true
      - key: graph_community_algorithm
        type: string
        label: 社区发现算法(label_propagation/greedy_modularity)
        default: label_propagation
      - key: graph_linkage_co_occurrence_threshold
        type: int
        label: linkage 置信度提升的共现阈值
        default: 3
        min: 1
        max: 100
      - key: graph_linkage_new_pair_threshold
        type: int
        label: linkage 发现新表对的共现阈值
        default: 5
        min: 1
        max: 100
      - key: graph_linkage_confidence_boost
        type: float
        label: linkage 每次同步的置信度增量
        default: 0.1
        min: 0.01
        max: 0.5
      - key: graph_linkage_discover_new_pairs
        type: bool
        label: linkage 同步允许发现新表对
        default: true
  - key: memory
    title: 记忆
    fields:
      - key: memory_recall_count
        type: int
        label: 每轮注入 prompt 的记忆条数上限
        default: 5
        min: 1
        max: 20
  - key: observability
    title: 可观测
    fields:
      - key: slow_query_ms
        type: int
        label: 慢查询阈值(毫秒)
        default: 10000
        min: 1000
        max: 60000
      - key: query_stats_retention_days
        type: int
        label: 查询统计保留天数(0=永久)
        default: 90
        min: 0
        max: 3650
  - key: schedule
    title: 定时任务
    fields:
      - key: metadata_refresh_hours
        type: int
        label: 语义层自动刷新间隔(小时,0=关闭)
        default: 6
        min: 0
        max: 720
      - key: health_check_interval_seconds
        type: int
        label: 数据源健康巡检间隔(秒)
        default: 300
        min: 30
        max: 86400
      - key: scan_metric_inference
        type: bool
        label: 扫描时 LLM 推断复合指标
        default: true
      - key: health_check_max_failures
        type: int
        label: 健康巡检连续失败自动停用阈值(次)
        default: 3
        min: 1
        max: 20
      - key: index_gc_keep_generations
        type: int
        label: 索引保留成功代际数(active 之外再保留几个已发布旧分区)
        default: 2
        min: 1
        max: 10
      - key: index_gc_published_grace_seconds
        type: int
        label: 翻出保留集的旧分区删除宽限(秒, 保护持旧指针的在途查询)
        default: 600
        min: 0
        max: 86400
      - key: index_gc_unfinished_ttl_seconds
        type: int
        label: 构建中/让路半成品分区回收 TTL(秒)
        default: 86400
        min: 300
        max: 604800
