# Generic customer assistant; installed scenarios and MCP declarations define capabilities.
dependencies:
  knowledge_graph:
    pack: knowledge_graph
    required: true
  chatbi:
    pack: chatbi
    required: true

domain:
  description: >
    智能客服:根据已接入能力进行知识问答与业务查询,答案遵守资料证据与访问权限。
  compact_focus: 已选择能力、该能力已确认参数、当前追问、资料来源与查询结果

runtime_contract:
  required_tools: [metrology_assistant]

admin:
  page: metrology_assistant
  title: 智能客服

artifact:
  type: data
  actions: [view_json]
  display:
    data_hidden:
      - type
    data_labels:
      kb: 知识库
      conclusion: 结论
      chunkCount: 命中片段
      status: 状态
      columns: 数据列
      rowTotal: 结果行数
      name: 器具名称
      model: 型号规格
      measureRange: 测量范围
      accuracy: 准确度
      feeYuan: 检测费
      mandatoryL1: 强检一级目录
      mandatoryL2: 强检二级目录
      periodMonths: 检校周期
      regulation: 技术规程
    welcome_icon: search
    # 欢迎示例是本 pack 的展示声明(manifest 层):给进入智能客服的用户
    # 能力入口提示;引擎零业务词的边界在代码,manifest 描述自身合法。
    welcome_examples:
      - {title: 强检判定, desc: 器具+用途,是否强制检定, prompt: 压力表用于贸易结算,需要强制检定吗？, icon: search}
      - {title: 进度查询, desc: 委托单检测进度, prompt: 帮我查一下委托单 BJ2026 的检测进度, icon: file-text}
      - {title: 检测耗时, desc: 多少个工作日, prompt: 压力表送检大概要几个工作日？, icon: clock-circle}
      - {title: 资质能力, desc: 能不能检, prompt: 你们能检角膜曲率计吗？, icon: safety-certificate}
      - {title: 器具价目, desc: 测量范围·检测费·检校周期, prompt: 查一下肺活量测试仪的测量范围, icon: file-text}
      - {title: 设备查询, desc: 设备状态·校准到期, prompt: 帮我查一下 EQ-0001 设备现在什么状态, icon: tool}
