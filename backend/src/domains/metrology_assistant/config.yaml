# Generic customer assistant; installed scenarios and MCP declarations define capabilities.
dependencies:
  knowledge_graph:
    pack: knowledge_graph
    required: true
  chatbi:
    pack: chatbi
    required: true

domain:
  description: >
    智能客服:根据已接入能力进行知识问答与业务查询,答案遵守资料证据与访问权限。
  compact_focus: 已选择能力、该能力已确认参数、当前追问、资料来源与查询结果

runtime_contract:
  required_tools: [metrology_assistant]

admin:
  page: metrology_assistant
  title: 智能客服

artifact:
  type: data
  actions: [view_json]
  display:
    data_hidden:
      - type
    data_labels:
      kb: 知识库
      conclusion: 结论
      chunkCount: 命中片段
      status: 状态
      columns: 数据列
      rowTotal: 结果行数
    welcome_icon: search
    welcome_examples: []
