# 智能客服插件配置 schema(管理端"插件设置"渲染为通用表单)
# 优先级:设置页保存值 > 环境变量(env) > 默认值(default)
# 展示配置(display 组)由 /api/meta/packs 合并进 manifest——
# 管理端改完即生效,无需改 config.yaml 重新部署。
version: 1
groups:
  - key: display
    title: 展示配置
    fields:
      - key: no_evidence_notice
        type: string
        label: 无依据引导话术
        placeholder: 已检索{tried_kb}，未找到相关资料。当前可咨询{labels}。请换个问法，或联系业务窗口人工确认。
        help: 知识库检索无依据时的统一引导话术;占位符 {labels}=当前能力清单、{tried_kb}=已检索来源、{prefix}=检索前缀(无可用库时为空);留空用内置默认。改完即生效
      - key: welcome_title
        type: string
        label: 欢迎页标题
        placeholder: 智能助手
        help: 对话欢迎页的大标题;留空用 manifest 默认值(智能助手)
      - key: welcome_subtitle
        type: string
        label: 欢迎页副标题
        placeholder: 用自然语言描述你的需求，我来帮你完成
        help: 欢迎页标题下方的说明文字
      - key: welcome_examples
        type: string
        label: 常用问题(JSON)
        placeholder: '[{"title":"强检判定","desc":"器具+用途","prompt":"...","icon":"search"}]'
        help: 欢迎页示例卡(JSON 数组,字段 title/desc/prompt/icon);留空用 manifest 默认。改完即生效,无需部署
