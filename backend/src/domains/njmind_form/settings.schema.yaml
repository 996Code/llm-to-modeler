# njmind_form 插件配置 schema(管理端"插件设置"渲染为通用表单)
# 优先级:设置页保存值 > 环境变量(env) > 默认值(default)
version: 1
groups:
  - key: display
    title: 展示配置
    fields:
      - key: welcome_title
        type: string
        label: 欢迎页标题
        placeholder: 智能助手
        help: 对话欢迎页的大标题;留空用 manifest 默认值
      - key: welcome_subtitle
        type: string
        label: 欢迎页副标题
        placeholder: 用自然语言描述你的需求，我来帮你完成
        help: 欢迎页标题下方的说明文字
      - key: welcome_examples
        type: string
        label: 常用问题(JSON)
        placeholder: '[{"title":"...","desc":"...","prompt":"...","icon":"search"}]'
        help: 欢迎页示例卡(JSON 数组,字段 title/desc/prompt/icon);留空用 manifest 默认。改完即生效,无需部署
