# 知识图谱插件配置 schema(管理端"插件设置"渲染为通用表单)
# 优先级:设置页保存值 > 环境变量(env) > 默认值(default)
version: 1
groups:
  - key: connection
    title: 存储连接
    fields:
      - key: neo4j_uri
        type: string
        label: Neo4j 地址
        env: NEO4J_URI
        required: true
        placeholder: bolt://localhost:7687
        help: 图谱存储;本机 docker 可用 kg-neo4j 容器
      - key: neo4j_user
        type: string
        label: Neo4j 用户
        env: NEO4J_USER
        default: neo4j
      - key: neo4j_password
        type: secret
        label: Neo4j 密码
        env: NEO4J_PASSWORD
        required: true
      - key: neo4j_database
        type: string
        label: Neo4j 数据库
        env: NEO4J_DATABASE
        default: neo4j
        help: 社区版只有默认库 neo4j

  - key: extraction
    title: 抽取与批次
    fields:
      - key: chunk_target_chars
        type: int
        label: 目标块字数
        default: 1200
        min: 200
        max: 8000
        help: 结构感知切块的目标大小(标题边界优先)
      - key: chunk_overlap_chars
        type: int
        label: 块重叠字数
        default: 100
        min: 0
        max: 500
      - key: chunk_max_chars
        type: int
        label: 单块硬上限
        default: 3000
        min: 500
        max: 16000
      - key: chunk_structural_max_chars
        type: int
        label: 章节块上限
        default: 10000
        min: 1000
        max: 50000
        help: 识别到章节标题时整章一块的上限(超长章才切);抽取按章、向量按段
      - key: vector_subchunk_chars
        type: int
        label: 向量子切块字数
        default: 500
        min: 300
        max: 4000
        help: 向量入库时按句读子切的段长;子段越小命中越准,连贯性由检索时父子回带(命中段回带父块上下文)补足
      - key: llm_batch_size
        type: int
        label: 每批 chunk 数
        default: 4
        min: 1
        max: 16
        help: 批次 = 并行与断点单位(批次间串行更新实体词表 + 落 checkpoint)
      - key: extraction_model
        type: string
        label: 抽取模型覆盖
        env: KG_EXTRACTION_MODEL
        placeholder: 留空用全局模型
        help: 长文档导入建议配更快的模型(如 qwen-plus),对话/检索链路仍用全局模型;留空 = 不覆盖
      - key: llm_concurrency
        type: int
        label: 批内并行度
        default: 2
        min: 1
        max: 8
        help: 批内并行的 LLM 抽取调用数(注意上游限流)
      - key: llm_max_retries
        type: int
        label: 单块重试次数
        default: 2
        min: 0
        max: 5
      - key: failure_threshold
        type: int
        label: 连续失败熔断阈值
        default: 5
        min: 1
        max: 50
        help: 连续抽取失败达到该数则中止任务(防上游故障烧重试)
      - key: glossary_top_k
        type: int
        label: 跨块实体词表上限
        default: 100
        min: 0
        max: 500
        help: 注入后续 prompt 的已知实体数(命名一致性;0 = 关闭)
      - key: llm_identity_merge
        type: bool
        label: 收尾LLM身份复合
        default: true
        help: 导入收尾把全图实体名录分批交给 LLM 找"同一实体被拆成多节点"的残余;每个提案必须在双方溯源块原文中找到双名共现窗口才合并(代码接地,宁漏不错)
      - key: llm_identity_merge_types
        type: string
        label: 身份复合类型白名单
        default: person,creature
        help: 允许参与同一性复合的实体类型(逗号分隔)。地名/物品的"同一性"提案几乎全是包含关系(山与山中的洞),身份同一性是有名字的角色才有的属性;留空 = 不限类型(不建议)
      - key: extraction_temperature
        type: int
        label: 抽取温度(x100)
        default: 10
        min: 0
        max: 100
        help: 存整数避免浮点表单精度问题,10 = 0.1
      - key: embed_batch_size
        type: int
        label: 向量化批大小
        default: 4
        min: 1
        max: 16
        help: 每批向量化的段数;bge-m3 CPU 推理内存与批大小线性相关,16 段曾撞 4G 容器上限 OOM(两次线上实锤),调大队列前先确认容器内存余量
      - key: llm_rpm_limit
        type: int
        label: LLM 请求限速(每分钟)
        default: 0
        min: 0
        max: 10000
        help: 全局令牌桶(0=不限)。撞服务商 RPM 限额时配置;429 会自动全局退避
      - key: llm_tpm_limit
        type: int
        label: LLM Token 限速(每分钟)
        default: 0
        min: 0
        max: 10000000
        help: 按估算 token 扣桶(0=不限)。长文档导入必配,防 TPM 撞限
      - key: import_max_auto_retry
        type: int
        label: 导入失败自动续跑次数
        default: 3
        min: 0
        max: 10
        help: 失败(非欠费/鉴权类)后 5 分钟自动重新入队;块级断点保证只跑剩余部分
      - key: ocr_engine
        type: enum
        label: 扫描件 OCR 引擎
        options: [rapidocr, llm]
        default: rapidocr
        env: KG_OCR_ENGINE
        help: PDF 无文字层页的识别引擎;llm = 逐页图片走全局 LLM 网关的多模态模型(随 LLM_MODEL 环境变量),识别更全但耗时/费用高于本地 rapidocr

  - key: retrieval
    title: 检索与问答
    fields:
      - key: graph_max_hops
        type: int
        label: 图谱扩展跳数
        default: 2
        min: 1
        max: 3
      - key: graph_max_nodes
        type: int
        label: 子图节点上限
        default: 80
        min: 10
        max: 300
      - key: graph_max_edges
        type: int
        label: 子图边上限
        default: 150
        min: 10
        max: 600
      - key: vector_top_k
        type: int
        label: 向量召回条数
        default: 5
        min: 1
        max: 20
      - key: fulltext_fallback_enabled
        type: bool
        label: 图谱零命中全文兜底
        default: true
        help: 图谱种子零命中(别名/错别字/部分匹配)时,kg_chunks 走 PG 全文检索(tsvector+GIN,2-gram 分词)补充召回原文片段;兜底失败自动降级不阻断
      - key: rerank_enabled
        type: bool
        label: 启用 rerank 精排
        default: false
        help: 需平台配置 RERANK_BASE_URL/RERANK_MODEL;失败自动降级原序不阻断
      - key: answer_temperature
        type: int
        label: 回答温度(x100)
        default: 30
        min: 0
        max: 100

  - key: files
    title: 上传限制
    fields:
      - key: max_upload_mb
        type: int
        label: 单文件上限(MB)
        default: 20
        min: 1
        max: 200
