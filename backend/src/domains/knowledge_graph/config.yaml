# 知识图谱插件 manifest
# 依赖声明(环境变量/设置页补配均可) + 管理页/设置页注册。

domain:
  description: >
    知识库/知识图谱的检索与问答("查一下知识库里""XX 和 YY 是什么关系"
    "根据产品手册回答…")类需求;需要基于已导入文档回答事实性问题时路由到本域
  compact_focus: 检索过的知识库名、查询到的实体与得出的结论

admin:
  settings: settings.schema.yaml   # 声明式配置页(连接/抽取/检索参数)
  page: knowledge_graph            # 自定义管理页组件 key(前端注册表解析)
  title: 知识图谱
  # 设置保存后的热生效副作用(平台按声明执行,api 层零 pack 分支):
  # rate_limit = 限速参数保存即重配全局限速器,rpm/tpm 指向设置 key
  settings_side_effects:
    - {type: rate_limit, rpm: llm_rpm_limit, tpm: llm_tpm_limit}

# 基础设施依赖:字段引用 settings.schema.yaml 的 key(解析链 设置页 > env > 默认)。
# 未配置 → 插件中心"依赖未配置"不可加载;配好 env 或设置页补配后"重新检测"热加载。
dependencies:
  neo4j:
    required: true
    fields:
      - neo4j_uri
      - neo4j_user
      - neo4j_password
    probe:
      module: domains.knowledge_graph.probes
      fn: neo4j
  milvus:
    required: true
    fields:
      - milvus_uri
    probe:
      module: domains.knowledge_graph.probes
      fn: milvus

# 数据制品(检索返回的子图走 data 制品,前端通用数据卡可展示)
artifact:
  type: data
  actions: [view_json]
  display:
    # 数据结果卡片的 key→中文标签(通用组件查表展示用)
    data_labels:
      intent: 检索意图
      kb: 知识库
      entityCount: 命中实体
      relationCount: 命中关系
      chunkCount: 命中文档片段
    # 欢迎页大图标(前端通用图标集里的名字,未知名字回退默认)
    welcome_icon: search
    # 欢迎页示例卡(点击直接发送 prompt)
    welcome_examples:
      - {title: 实体查询, desc: 查人物、组织、地点的属性, prompt: 张小凡的师父是谁？, icon: search}
      - {title: 关系追问, desc: 两个实体之间的关联, prompt: 青云门和天音寺是什么关系？, icon: share-alt}
      - {title: 文档检索, desc: 基于导入文档的事实问答, prompt: 知识库里关于入职流程是怎么规定的？, icon: file-text}
      - {title: 图谱浏览, desc: 查看实体关联的子图, prompt: 帮我看看和碧瑶相关的所有人物关系, icon: apartment}
