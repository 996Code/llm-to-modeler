# 领域声明（引擎一级路由的候选依据——描述里不带工具细节，引擎据此选"领域"）
domain:
  description: 请假申请的提交与审批状态查询（"帮我请假/查审批进度"类需求）

# 依赖的上游服务名（地址由宿主 services 表按请求下发，未下发 fail-closed，见 upstream_client.resolve_base）
services:
  leave-system: {}

# 上游端点路径（与 njmind_form 的 paths 段同构；工具代码从此表取，单一事实源）
paths:
  validate: /api/leave/validate
  submit: /api/leave/submit
  status: /api/leave/status

# 演示插件说明：本 pack 为插件化架构的最小示例（Demo），生产按需保留。
# data 类制品无 identity/diff 对齐需求，故省略 artifact 段。
