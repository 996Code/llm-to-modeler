# =============================================================================
# 一体镜像 nginx 配置 —— 与 frontend/nginx.conf 同构，仅两处差异：
#   1. 后端在本机 8000（127.0.0.1:8000），不再跨容器 http://backend:8000；
#   2. 对外统一端口 8080（docker -p 映射），不再依赖 compose 网络。
# 其余路径规则与双容器版完全一致（同源前缀 /ai-modeler，SSE 防缓冲三件套）。
# =============================================================================
server {
    listen 8080;
    server_name _;

    # ── 前端 SPA（vite base=/ai-modeler/，静态资源与页面都在此前缀下）──
    location /ai-modeler/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-modeler/index.html;
    }

    # embed.js（standalone SDK，构建产物在 dist 根，精确匹配避免被 SPA 兜底吞掉）
    location = /ai-modeler/embed.js {
        root /usr/share/nginx/html;
    }

    # ── API 反代（剥 /ai-modeler 前缀 → 后端 /api/*）──
    location /ai-modeler/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 宿主网关注入的鉴权头透传（嵌入模式 SSO 链路的一环）
        proxy_set_header X-User-Id $http_x_user_id;
        # SSE 三道保障之 nginx 侧：关缓冲 + 关缓存（后端另有 15s 心跳 +
        # no-transform；曾因代理 gzip/缓冲导致事件攒到流结束才吐）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # LLM 长管线（大表单 modify 可到分钟级）
    }

    # MCP 反代（同理剥前缀）
    location /ai-modeler/mcp {
        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # MCP Streamable HTTP 可升 WS
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # 健康检查反代（宿主/d monitoring 探测 /ai-modeler/api/health，与业务同链路）
    location = /ai-modeler/api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    # 根路径重定向到前缀入口（浏览器直访 IP:端口 时落到前端）
    location = / {
        return 302 /ai-modeler/;
    }
}
