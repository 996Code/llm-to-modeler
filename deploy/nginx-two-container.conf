# =============================================================================
# 双容器方案的前端 nginx：静态 + 反代后端容器（backend:8000）。
# 与 deploy/nginx-allin1.conf 的差异仅一处：上游是容器名 backend（docker
# network 内 DNS），非 127.0.0.1。路径规则/SSE 防缓冲与之一致。
# =============================================================================
server {
    listen 80;
    server_name _;

    # 前端 SPA（vite base=/ai-modeler/）
    location /ai-modeler/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-modeler/index.html;
    }

    location = /ai-modeler/embed.js {
        root /usr/share/nginx/html;
    }

    # API 反代（剥 /ai-modeler 前缀 → 后端 /api/*）
    location /ai-modeler/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Id $http_x_user_id;
        # SSE：关缓冲/缓存（后端另有 15s 心跳 + no-transform 双保险）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # MCP 反代
    location /ai-modeler/mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # 健康检查（与业务同链路）
    location = /ai-modeler/api/health {
        proxy_pass http://backend:8000/api/health;
        access_log off;
    }

    location = / {
        return 302 /ai-modeler/;
    }
}
