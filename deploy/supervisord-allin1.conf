; =============================================================================
; 一体镜像进程托管 —— nginx（前端+反代）与 uvicorn（后端）双进程
; 由 supervisord 统一拉起/守护：任一进程崩溃自动重启，容器不退出。
; 日志全部重定向到 stdout/stderr（docker logs 直接可看）。
; =============================================================================

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
; --workers 1：SqliteSaver/checkpoint 是单写者模型，多 worker 会交叉写库；
; 纵向扩容靠进程内线程池（graph.stream 已走 executor），不靠 uvicorn 多进程
command=/usr/local/bin/uvicorn src.main:app --host 127.0.0.1 --port 8000
directory=/app
environment=PYTHONPATH="/app/deps:/app"
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
