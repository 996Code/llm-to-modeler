# =============================================================================
# 一体容器 nginx：静态（sendfile 直出）+ API 反代本机 uvicorn（127.0.0.1:8000）。
# 与宿主网关约定：对外统一 /ai-modeler 前缀（designer dev 代理/生产网关同款）。
# =============================================================================
server {
    listen 80;
    server_name _;

    # 前端 SPA（vite base=/ai-modeler/；dist 已 COPY 到 html/ai-modeler/）
    location /ai-modeler/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-modeler/index.html;
    }

    # embed.js（standalone SDK，精确匹配避免 SPA 兜底）
    location = /ai-modeler/embed.js {
        root /usr/share/nginx/html;
    }

    # 静态资源缓存（带 hash 的 assets 一年；index.html 不缓存保证发版即生效）
    location /ai-modeler/assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代（剥 /ai-modeler → 后端 /api/*；宿主网关注入的鉴权头透传）
    location /ai-modeler/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Id $http_x_user_id;
        # SSE：关缓冲/缓存（后端另有 15s 心跳 + no-transform）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # MCP 反代（Streamable HTTP 可升 WS）
    location /ai-modeler/mcp {
        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # 健康检查（与业务同链路；宿主探测 /ai-modeler/api/health）
    location = /ai-modeler/api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    location = / {
        return 302 /ai-modeler/;
    }
}
