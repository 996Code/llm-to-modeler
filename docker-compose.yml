# =============================================================================
# llm-to-modeler 完整部署栈（全中间件一站编排）
#   app            一体容器（nginx 静态/反代 + uvicorn API）
#   metrology-mcp  mock 计量业务平台（南京院客服 Demo；复用 app 镜像，
#                  command 覆盖——不想要该服务时注释掉整个块即可，
#                  app 不依赖它存活，仅客服插件的进度/价目场景受影响）
#   neo4j          图谱（KG 插件依赖）
#   postgres       PostgreSQL 16 + pgvector（平台存储 + 向量，同库）
# 向量存储默认且仅走 PG(pgvector)——VECTOR_BACKEND=milvus 后端已随
# Milvus 下线移除,如需恢复见 git 历史本文件的 milvus 服务块。
#
# app 镜像由 deploy/deploy.sh 预构建（纯 COPY、零联网 build），compose 负责
# 声明式管理：启停/替换/日志/数据卷。版本经 TAG 环境变量切换：
#   TAG=a84e26a docker compose up -d
# （deploy.sh 已自动带 TAG；手工操作时缺省 latest）
#
# 每个服务都带 healthcheck（deploy.sh ⑤ 段另有发布期主动探测+回滚）：
#   postgres  pg_isready          app 依赖(service_healthy)
#   neo4j     HTTP :7474 探活     app 依赖(service_healthy)
#   app       /ai-modeler/api/health
#   metrology-mcp  /mcp 端点可达（streamable HTTP 对普通 GET 返回
#                406=协议协商拒绝——这正是"服务活着"的证据,200/406 均算健康）
#
# 日常命令：
#   docker compose ps              # 状态
#   docker compose logs -f app     # 应用日志
#   docker compose down            # 停止（数据保留）
# =============================================================================
services:
  # ── 应用（一体容器：nginx 静态/反代 + uvicorn API） ──
  app:
    image: llm-modeler:${TAG:-latest}
    container_name: llm-modeler
    restart: unless-stopped
    # 内存护栏:本地 ONNX embedding 推理是内存大户(修复前单批曾需
    # 17GB,把 32G 主机打满)。设硬上限——超限时本容器被 OOM kill
    # (docker 事件可见)而不是拖垮整机;上限要容得下模型+并发批峰值,
    # 默认 8g:足以容纳原 16 段批的推理峰值 4.5G+ 底座 1.2G≈5.7G 的最坏组合;配合 af23336(批 4 段,峰值 ~1.9G)则常态只用 1/4,余量充足。经 .env 的 APP_MEM_LIMIT 调整。
    mem_limit: ${APP_MEM_LIMIT:-8g}
    mem_reservation: ${APP_MEM_RESERVATION:-1g}
    ports:
      - "${HOST_PORT:-19090}:80"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?请在 .env 配置 NEO4J_PASSWORD}
      # 向量后端:pg(pgvector,走下方 postgres 服务,零额外容器)
      - VECTOR_BACKEND=pg
      # 存储后端:平台 PG-only,DATABASE_URL 必填(默认指向下方 postgres 服务)。
      # 显式设 DATABASE_URL 改指外部 PG 时注意:本地 postgres 服务仍会启动且
      # POSTGRES_PASSWORD 仍必填(可给随机值;多余容器可手动停,app 不依赖其
      # 健康)。存量 SQLite 迁移:停 app 容器后跑
      # backend/scripts/migrate_sqlite_to_pg.py(幂等,见其头部 runbook)。
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-llm}:${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_modeler}}
      # PG 连接池(services/db.py 读取;默认 2/8)
      - PG_POOL_MIN=${PG_POOL_MIN:-2}
      - PG_POOL_MAX=${PG_POOL_MAX:-8}
    volumes:
      # 数据持久化（KG 上传文件等;会话/日志/checkpoint 落 PG 不走本卷）
      - ./data/app:/app/data
      # 日志（loguru 轮转文件；stdout 由 docker logs 消费）
      - ./data/logs:/app/logs
      # embedding 模型：deploy.sh 首次部署时下载到 data/models/embedding/
      - ./data/models/embedding:/app/models/embedding
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # mock 业务平台只服务客服 Demo 场景——不作为 app 启动门槛
      # (service_started:异步拉起,不阻塞也不拖垮主服务)
      metrology-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/ai-modeler/api/health | grep -q '\\\"status\\\": *\\\"healthy\\\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── mock 计量业务平台（南京院客服 Demo 的 MCP server）─────────────────
  # 复用 app 镜像(deps 里已有 mcp SDK),command 覆盖为只跑 MCP server。
  # 不映射宿主端口:仅 compose 内网可达(app 经服务名 http://metrology-mcp:9771/mcp
  # 连接;注册表/数据源配置用该 URL)——mock 数据不暴露到宿主网络。
  # 内存护栏:纯 Python + 24 条 JSON 夹具,128m 足够(实测 ~40MB)。
  metrology-mcp:
    image: llm-modeler:${TAG:-latest}
    container_name: llm-modeler-metrology-mcp
    restart: unless-stopped
    # ⚠ 镜像 ENTRYPOINT 是 /app/start.sh(起后端主应用)——command 只能
    # 覆盖 CMD 不覆盖 ENTRYPOINT,必须用 entrypoint 覆盖进程(真实事故:
    # command 覆盖下 MCP 容器跑成后端,因无 DATABASE_URL 崩溃)
    entrypoint: ["python", "/app/mcp-e2e/metrology_server.py"]
    mem_limit: ${MCP_MEM_LIMIT:-128m}
    mem_reservation: 32m
    environment:
      - TZ=Asia/Shanghai
      - METROLOGY_MCP_HOST=0.0.0.0
      - METROLOGY_MCP_PORT=9771
    healthcheck:
      # streamable HTTP MCP 端点对无协议头的普通 GET 返回 406(协商拒绝)
      # ——curl -f 会把 4xx 当失败,这里显式取状态码,200/406 均判活
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9771/mcp); [ \"$$code\" = 200 ] || [ \"$$code\" = 406 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Neo4j 图谱（社区版） ──
  neo4j:
    image: neo4j:5-community
    container_name: llm-modeler-neo4j
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?请在 .env 配置 NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=1G
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-17474}:7474"
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── PostgreSQL（存储后端：承载会话/调用日志/任务/插件设置/KG 元数据/
  #    LangGraph checkpoint + 向量存储(pgvector HNSW);平台 PG-only,
  #    DATABASE_URL 必填) ──
  # 镜像用 pgvector/pgvector:pg16(官方 postgres:16 + pgvector 扩展,
  # 数据卷与 postgres:16 兼容;向量表建表时自动 CREATE EXTENSION vector)。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llm-modeler-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${POSTGRES_USER:-llm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-llm_modeler}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm} -d ${POSTGRES_DB:-llm_modeler}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s